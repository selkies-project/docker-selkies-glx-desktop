name: Publish container

# Multi-architecture (x86_64 + aarch64) image, published to ghcr.io the way the
# Selkies base container is: each architecture builds on a native runner (no
# QEMU) and pushes by digest, and a merge job assembles the multi-arch manifest
# under the release tag, a persistent tag carrying the commit time, and
# `latest`. A pull request builds both architectures and pushes nothing.

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Tag of the Selkies base container to build on
        type: string
        default: latest-ubuntu26.04
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
      - LICENSE
      # Deployment examples, which the image does not carry
      - docker-compose.yml
      - xgl.yml
  pull_request:
    branches: [ main ]
    paths-ignore:
      - README.md
      - LICENSE
      # Deployment examples, which the image does not carry
      - docker-compose.yml
      - xgl.yml

permissions:
  contents: read
  packages: write

# A push supersedes the build of the one before it on the same branch, which
# would publish an image the newer one replaces anyway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: selkies-project/selkies-glx-desktop
  BASE_IMAGE: ghcr.io/selkies-project/selkies/base
  # The distribution inside the image, which the Selkies base tag names too
  DISTRIB_RELEASE: "26.04"
  # ghcr answers a secondary rate limit with 403 on the push itself, so a
  # failed push is retried once after the minute GitHub asks for
  PUSH_RETRY_DELAY: "60"

jobs:
  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflow files
        # actionlint checks the expressions and runs shellcheck over every `run:` block, the
        # releases Selkies' CI lints its own with, each checked against its SHA-256 (a version
        # bump takes the hash with it)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL --retry 5 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" actionlint.tar.gz "${SHELLCHECK_SHA256}" shellcheck.tar.xz | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          PATH="${PWD}:${PATH}" ./actionlint -color

  build:
    name: Build ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        # The desktop layers outgrow the runner's free space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the kwin source versions the archive serves
        id: kwin
        env:
          DISTRIB_RELEASE: ${{ env.DISTRIB_RELEASE }}
        # The rebuilt kwin stages are cached by these, so a new archive version
        # rebuilds them where the cache would hand back the last one's packages
        run: |
          docker run --rm "ubuntu:${DISTRIB_RELEASE}" bash -c '
            sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
            apt-get update -qq
            for package in kwin-x11; do
              version="$(apt-get source --print-uris "${package}" | sed -n "s|.* ${package}_\(.*\)\.dsc .*|\1|p")"
              echo "${package//-/_}=${version}"
            done' | tee -a "$GITHUB_OUTPUT"
      - name: Read the proot-next release Steam's stand-in comes from
        id: proot
        env:
          GH_TOKEN: ${{ github.token }}
        # The Steam layer is cached by it, so a new release rebuilds that layer
        # where the cache would hand back the last one's binary
        run: echo "version=$(gh api repos/selkies-project/proot-next/releases/latest --jq .tag_name)" | tee -a "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: first
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        with:
          context: .
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ inputs.base_tag || 'latest-ubuntu26.04' }}
            KWIN_X11_VERSION=${{ steps.kwin.outputs.kwin_x11 }}
            PROOT_NEXT_VERSION=${{ steps.proot.outputs.version }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' }}
          # For the GitHub lookups behind the Dockerfile's download checks
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          # In the registry, which keeps it whole: the Actions cache's 10 GB held
          # the kwin rebuild's layers only until the desktop's evicted them
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch.name }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAME, matrix.arch.name) || '' }}
      - name: Wait for the registry
        if: ${{ steps.first.outcome == 'failure' }}
        run: sleep "${PUSH_RETRY_DELAY}"
      - name: Build and push by digest (second attempt)
        id: retry
        if: ${{ steps.first.outcome == 'failure' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ inputs.base_tag || 'latest-ubuntu26.04' }}
            KWIN_X11_VERSION=${{ steps.kwin.outputs.kwin_x11 }}
            PROOT_NEXT_VERSION=${{ steps.proot.outputs.version }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' }}
          # For the GitHub lookups behind the Dockerfile's download checks
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          # In the registry, which keeps it whole: the Actions cache's 10 GB held
          # the kwin rebuild's layers only until the desktop's evicted them
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch.name }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAME, matrix.arch.name) || '' }}
      - name: Export the digest
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          DIGEST: ${{ steps.retry.outputs.digest || steps.first.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: digest-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge the multi-arch manifest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the commit time
        run: echo "COMMIT_TIME_GIT=$(TZ=UTC git show -s --format='%cd' --date=format-local:'%Y%m%d%H%M%S')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -e
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          # One empty file per pushed digest, named after it
          SOURCES=()
          for digest in *; do SOURCES+=("${IMAGE}@sha256:${digest}"); done
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
                 -t "${IMAGE}:${DISTRIB_RELEASE}" \
                 -t "${IMAGE}:${DISTRIB_RELEASE}-${COMMIT_TIME_GIT}" \
                 -t "${IMAGE}:latest" \
                 "${SOURCES[@]}"; then
              exit 0
            fi
            echo "manifest push failed (attempt ${attempt}); waiting for the registry"
            sleep "${PUSH_RETRY_DELAY}"
          done
          exit 1

  cleanup:
    name: Prune untagged images
    needs: merge
    # Each push moves the tags onto new manifests, and the platform images and
    # attestations they pointed at before stay in the registry untagged
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cleanup-images
    # A prune that hits a rate limit must not fail the publish
    continue-on-error: true
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: selkies-glx-desktop
          delete-untagged: true
          # A build in flight has its platform images untagged until its
          # manifest lands, so the window stays well clear of a publish
          older-than: 1 day
