apiVersion: apps/v1
kind: Deployment
metadata:
  name: xgl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xgl
  template:
    metadata:
      labels:
        app: xgl
    spec:
      hostname: xgl
      # Uncomment to disable network isolation, which the WebRTC transport needs
      # without a TURN server; display `:20` must then be free on the node, and
      # the cluster may disallow this
#      hostNetwork: true
      containers:
      - name: xgl
        # Tags: `26.04` (Ubuntu 26.04, the current build), a persistent build
        # such as `26.04-20260101010101`, and `latest`
        image: ghcr.io/selkies-project/selkies-xgl-desktop:26.04
        env:
        - name: TZ
          value: "UTC"
        # Password of the container Linux user, and the web login when
        # SELKIES_BASIC_AUTH_PASSWORD is not set; choose either `value:` or
        # `secretKeyRef:` but not both
        - name: PASSWD
          value: "mypasswd"
#          valueFrom:
#            secretKeyRef:
#              name: my-pass
#              key: my-pass
        ###
        # Selkies settings, `selkies --help` and
        # https://github.com/selkies-project/selkies/blob/main/docs/settings.md
        # for the rest
        ###
        # Transport: the WebSocket default needs nothing but the web port;
        # `webrtc` needs the TURN or host-networking arrangements below
#        - name: SELKIES_MODE
#          value: "webrtc"
        # The X server's initial mode, replaced by the client's size once it
        # connects (dynamic resizing is on by default)
        - name: DISPLAY_SIZEW
          value: "1920"
        - name: DISPLAY_SIZEH
          value: "1080"
        - name: DISPLAY_REFRESH
          value: "60"
        # NVIDIA GPUs: the video port the driver reports a monitor on (`DFP`, a
        # `DP-*` port, or `none` for a server without RandR outputs); a monitor
        # plugged into that port shows the desktop
        - name: VIDEO_PORT
          value: "DFP"
        # Video encoder: `h264enc` (default, hardware NVENC/VA-API when the GPU
        # has it, x264 otherwise), `h264enc-striped`, or `jpeg`
#        - name: SELKIES_ENCODER
#          value: "h264enc"
        # Initial video bitrate in kilobits per second and frames per second,
        # both adjustable from the web interface
        - name: SELKIES_VIDEO_BITRATE
          value: "8000"
        - name: SELKIES_FRAMERATE
          value: "60"
        - name: SELKIES_AUDIO_BITRATE
          value: "128000"
        # The web login, on by default: `ubuntu` and PASSWD unless set here
        - name: SELKIES_ENABLE_BASIC_AUTH
          value: "true"
#        - name: SELKIES_BASIC_AUTH_USER
#          value: "ubuntu"
#        - name: SELKIES_BASIC_AUTH_PASSWORD
#          value: "mypasswd"
#          valueFrom:
#            secretKeyRef:
#              name: my-pass
#              key: my-pass
        # TLS is served by default on a certificate minted per install; name a
        # real one, or set false for a deployment that terminates TLS in front
        - name: SELKIES_ENABLE_HTTPS
          value: "true"
#        - name: SELKIES_HTTPS_CERT
#          value: /etc/ssl/certs/ssl-cert-snakeoil.pem
#        - name: SELKIES_HTTPS_KEY
#          value: /etc/ssl/private/ssl-cert-snakeoil.key
        ###
        # WebRTC transport: an external TURN server, or the container's own
        ###
#        - name: SELKIES_TURN_HOST
#          value: "turn.example.com"
#        - name: SELKIES_TURN_PORT
#          value: "3478"
        # `tcp` when UDP is throttled or blocked in the client network
#        - name: SELKIES_TURN_PROTOCOL
#          value: "udp"
        # TURN over TLS needs a valid hostname and certificate on the TURN server
#        - name: SELKIES_TURN_TLS
#          value: "false"
        # Internal TURN server: its port range, with the ports below opened;
        # leave the external TURN settings unset
#        - name: TURN_MIN_PORT
#          value: "65532"
#        - name: TURN_MAX_PORT
#          value: "65535"
        # One of the shared secret, or the username and password pair
#        - name: SELKIES_TURN_SHARED_SECRET
#          valueFrom:
#            secretKeyRef:
#              name: turn-shared-secret
#              key: turn-shared-secret
#        - name: SELKIES_TURN_USERNAME
#          value: "username"
#        - name: SELKIES_TURN_PASSWORD
#          value: "mypasswd"
#          valueFrom:
#            secretKeyRef:
#              name: turn-password
#              key: turn-password
        # TURN REST API credentials, which replace every other TURN setting
#        - name: SELKIES_TURN_REST_URI
#          value: "http://localhost:8008"
        stdin: true
        tty: true
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # Internal TURN server ports
#        - containerPort: 3478
#          protocol: TCP
#        - containerPort: 65532
#          protocol: TCP
#        - containerPort: 65533
#          protocol: TCP
#        - containerPort: 65534
#          protocol: TCP
#        - containerPort: 65535
#          protocol: TCP
#        - containerPort: 3478
#          protocol: UDP
#        - containerPort: 65532
#          protocol: UDP
#        - containerPort: 65533
#          protocol: UDP
#        - containerPort: 65534
#          protocol: UDP
#        - containerPort: 65535
#          protocol: UDP
        resources:
          limits:
            memory: 64Gi
            cpu: "16"
            # NVIDIA GPUs through the NVIDIA device plugin; AMD and Intel GPUs
            # through their own plugins (`amd.com/gpu`, `gpu.intel.com/i915`)
            nvidia.com/gpu: 1
          requests:
            memory: 100Mi
            cpu: 100m
        volumeMounts:
        # The browsers inside the desktop crash on the default shared memory
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /cache
          name: xgl-cache-vol
        - mountPath: /home/ubuntu
          name: xgl-root-vol
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: xgl-cache-vol
        emptyDir: {}
#        persistentVolumeClaim:
#          claimName: xgl-cache-vol
      - name: xgl-root-vol
        emptyDir: {}
#        persistentVolumeClaim:
#          claimName: xgl-root-vol
