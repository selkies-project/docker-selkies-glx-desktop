services:
  xgl:
    container_name: xgl
    hostname: xgl
    # Tags: `26.04` (Ubuntu 26.04, the current build), a persistent build such
    # as `26.04-20260101010101`, and `latest`
    image: ghcr.io/selkies-project/selkies-xgl-desktop:26.04
    # NVIDIA GPUs: the NVIDIA Container Toolkit runtime and a device
    # reservation; other GPUs are passed as devices instead (see below)
    runtime: nvidia
    ports:
    - '8080:8080'
    # Internal TURN server ports, for the WebRTC transport without host networking
#    - '3478:3478'
#    - '65532-65535:65532-65535'
#    - '3478:3478/udp'
#    - '65532-65535:65532-65535/udp'
    stdin_open: true
    tty: true
    # The browsers inside the desktop crash on Docker's 64 MB default
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    # AMD and Intel GPUs (drop `runtime: nvidia` and the reservation above): the
    # DRM nodes, which the session user must be able to open, and which no
    # other X server or compositor on the host may be driving
#    devices:
#    - '/dev/dri:/dev/dri'
#    volumes:
#    - 'xgl-cache-vol:/cache'
#    - 'xgl-root-vol:/home/ubuntu'
    # Uncomment to disable network isolation, which the WebRTC transport needs
    # without a TURN server; display `:20` must then be free on the host
#    network_mode: 'host'
    environment:
    - TZ=UTC
    # Password of the container Linux user, and the web login when
    # SELKIES_BASIC_AUTH_PASSWORD is not set
    - PASSWD=mypasswd
    ###
    # Selkies settings, `selkies --help` and
    # https://github.com/selkies-project/selkies/blob/main/docs/settings.md for
    # the rest
    ###
    # Transport: the WebSocket default needs nothing but the web port; `webrtc`
    # needs the TURN or host-networking arrangements below
#    - SELKIES_MODE=webrtc
    # The X server's initial mode, replaced by the client's size once it
    # connects (dynamic resizing is on by default)
    - DISPLAY_SIZEW=1920
    - DISPLAY_SIZEH=1080
    - DISPLAY_REFRESH=60
    # NVIDIA GPUs: the video port the driver reports a monitor on (`DFP`, a
    # `DP-*` port, or `none` for a server without RandR outputs); a monitor
    # plugged into that port shows the desktop
    - VIDEO_PORT=DFP
    # Video encoder: `h264enc` (default, hardware NVENC/VA-API when the GPU has
    # it, x264 otherwise), `h264enc-striped`, or `jpeg`
#    - SELKIES_ENCODER=h264enc
    # Initial video bitrate in kilobits per second and frames per second, both
    # adjustable from the web interface
    - SELKIES_VIDEO_BITRATE=8000
    - SELKIES_FRAMERATE=60
    - SELKIES_AUDIO_BITRATE=128000
    # The web login, on by default: `ubuntu` and PASSWD unless set here
    - SELKIES_ENABLE_BASIC_AUTH=true
#    - SELKIES_BASIC_AUTH_USER=ubuntu
#    - SELKIES_BASIC_AUTH_PASSWORD=mypasswd
    # TLS is served by default on a certificate minted per install; name a real
    # one, or set false for a deployment that terminates TLS in front
    - SELKIES_ENABLE_HTTPS=true
#    - SELKIES_HTTPS_CERT=/etc/ssl/certs/ssl-cert-snakeoil.pem
#    - SELKIES_HTTPS_KEY=/etc/ssl/private/ssl-cert-snakeoil.key
    # Which GPU the session renders on when the container was given several
#    - SELKIES_AUTO_GPU=true
    ###
    # WebRTC transport: an external TURN server, or the container's own
    ###
#    - SELKIES_TURN_HOST=turn.example.com
#    - SELKIES_TURN_PORT=3478
    # `tcp` when UDP is throttled or blocked in the client network
#    - SELKIES_TURN_PROTOCOL=udp
    # TURN over TLS needs a valid hostname and certificate on the TURN server
#    - SELKIES_TURN_TLS=false
    # Internal TURN server: its port range, with the ports above opened; leave
    # the external TURN settings below unset
#    - TURN_MIN_PORT=65532
#    - TURN_MAX_PORT=65535
    # One of the shared secret, or the username and password pair
#    - SELKIES_TURN_SHARED_SECRET=n0TaRealCoTURNAuthSecretThatIsSixtyFourLengthsLongPlaceholdPlace
#    - SELKIES_TURN_USERNAME=username
#    - SELKIES_TURN_PASSWORD=mypasswd
    # TURN REST API credentials, which replace every other TURN setting
#    - 'SELKIES_TURN_REST_URI=http://localhost:8008'
